name: social
services:
  db:
    image: postgres:16.10
    container_name: postgres-db
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminPassword
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data:
